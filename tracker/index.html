<title>Venture Built Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column. Summary and key dates on top, then one card per role with its tasks and deadlines. */
:root {
  --bg: #F4F6F2;
  --surface: #FFFFFF;
  --ink: #0B1210;
  --ink-2: #46504B;
  --ink-3: #6B7268;
  --line: #E1E6E0;
  --line-2: #CFD6CF;
  --forest: #0F3D2E;
  --green: #14804A;
  --bright: #3EBD79;
  --tint: #E3F3EA;
  --neutral-pill: #EEF1ED;
  --warn-bg: #FFF1D6;
  --warn-ink: #7A4B00;
  --warn-line: #D9A441;
  --danger: #B3261E;
  --font: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 72px; display: flex; flex-direction: column; gap: 20px; }

/* Header */
.top { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.logo { height: 44px; width: auto; display: block; }
.top-meta { display: flex; flex-direction: column; gap: 2px; padding-left: 20px; border-left: 1px solid var(--line-2); min-width: 0; }
.top-meta h1 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 700; letter-spacing: -0.2px; text-wrap: balance; }
.top-meta p { margin: 0; font-size: 13px; color: var(--ink-3); }
.top .spacer { flex: 1; }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: 13px; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
.btn.primary:hover { background: var(--forest); border-color: var(--forest); }
.btn.link { border: 0; background: none; color: var(--green); padding: 6px 0; }
.btn.link:hover { color: var(--forest); text-decoration: underline; }
.btn.danger { border-color: transparent; background: none; color: var(--danger); }

/* Summary */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.summary { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 16px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-3); }
.stat.bad b { color: var(--danger); }
.bar-row { display: flex; align-items: center; gap: 14px; }
.bar { flex: 1; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--bright); border-radius: 99px; }
.bar-row small { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Key dates */
.dates { padding: 18px 24px 20px; display: flex; flex-direction: column; gap: 14px; }
.dates-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.dates-head h2 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-2); }
.dates-head span { font-size: 12px; color: var(--ink-3); }
.dates-scroll { overflow-x: auto; padding-bottom: 4px; }
.dates ol { list-style: none; margin: 0; padding: 0; display: flex; gap: 0; min-width: min-content; }
.dates li { position: relative; flex: 1 0 128px; padding: 16px 16px 0 0; border-top: 2px solid var(--line-2); display: flex; flex-direction: column; gap: 2px; }
.dates li::before { content: ""; position: absolute; left: 0; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-2); }
.dates li.next { border-top-color: var(--green); }
.dates li.next::before { background: var(--bright); border-color: var(--green); }
.dates li.past { opacity: 0.55; }
.dates li b { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.dates li span { font-size: 12.5px; color: var(--ink-2); }
.dates li.next em { font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--green); }

/* Controls */
.controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tabs { display: flex; gap: 6px; overflow-x: auto; max-width: 100%; padding-block: 2px; }
.tab { border: 1px solid transparent; background: transparent; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.tab:hover { background: var(--surface); }
.tab[aria-pressed="true"] { background: var(--forest); color: #fff; }
.tab small { margin-left: 6px; font-weight: 600; opacity: 0.7; font-variant-numeric: tabular-nums; }
.controls .spacer { flex: 1; }
.select { border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; }

/* Role cards */
.role { overflow: hidden; }
.role-head { display: flex; align-items: center; gap: 16px; padding: 16px 20px; flex-wrap: wrap; }
.role-head .who { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 1px; }
.role-head h2 { margin: 0; font-size: 17px; line-height: 1.25; font-weight: 700; }
.role-head p { margin: 0; font-size: 13px; color: var(--ink-3); }
.role-prog { display: flex; align-items: center; gap: 12px; }
.role-prog .bar { width: 110px; flex: none; }
.role-prog small { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--line); }
.row .main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.title-btn { border: 0; background: none; padding: 0; text-align: left; font-size: 14px; font-weight: 600; line-height: 1.4; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.title-btn:hover { color: var(--green); }
.row.done .title-btn { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line-2); }
.row.done { opacity: 0.72; }
.tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--forest); background: var(--tint); border-radius: 6px; padding: 2px 7px; }
button.tag { border: 0; cursor: pointer; }
button.tag:hover { filter: brightness(0.95); }
.tag.low { background: var(--neutral-pill); color: var(--ink-3); }
.edit-btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 4px 12px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.edit-btn:hover { border-color: var(--green); color: var(--green); }
.note { margin: 0; font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.due { min-width: 126px; display: flex; flex-direction: column; font-size: 13px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; line-height: 1.35; }
.due small { font-size: 12px; font-weight: 500; color: var(--ink-3); }
.row.late .due, .row.late .due small { color: var(--danger); }
.row.today .due small { color: var(--green); font-weight: 700; }
.pill { min-width: 100px; text-align: center; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
select.pill-sel { border: 0; cursor: pointer; text-align-last: center; appearance: none; -webkit-appearance: none; }
select.pill-sel option { background: #fff; color: #1a1a1a; }
.s-todo { background: var(--neutral-pill); color: var(--ink-2); }
.s-doing { background: var(--tint); color: var(--forest); }
.s-blocked { background: var(--warn-bg); color: var(--warn-ink); }
.s-done { background: var(--forest); color: #fff; }
.check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--surface); padding: 0; display: grid; place-items: center; position: relative; }
.check:hover { border-color: var(--green); }
.check[data-s="doing"] { border-color: var(--green); }
.check[data-s="doing"]::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--bright); }
.check[data-s="blocked"] { border-color: var(--warn-line); }
.check[data-s="blocked"]::after { content: ""; width: 10px; height: 2.5px; border-radius: 2px; background: var(--warn-ink); }
.check[data-s="done"] { background: var(--green); border-color: var(--green); }
.check svg { width: 14px; height: 14px; display: none; }
.check[data-s="done"] svg { display: block; }
.role-foot { padding: 4px 20px 10px; border-top: 1px solid var(--line); }
.empty-row { padding: 16px 20px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 13px; }
.empty { border: 1.5px dashed var(--line-2); border-radius: 14px; padding: 40px 24px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty b { font-size: 16px; color: var(--ink); }

/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(10, 16, 13, 0.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.panel { width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto; background: var(--surface); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.panel h2 { margin: 0; font-size: 18px; font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-3); }
.field input, .field select, .field textarea { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 10px 12px; font-size: 14px; width: 100%; min-width: 0; }
.field textarea { min-height: 76px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.actions .spacer { flex: 1; }
.err { margin: 0; color: var(--danger); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 640px) {
  .top-meta { border-left: 0; padding-left: 0; }
  .summary, .dates { padding-inline: 16px; }
  .row { grid-template-columns: 26px minmax(0, 1fr); padding-inline: 16px; gap: 12px; }
  .meta { grid-column: 2; justify-content: flex-start; }
  .due { min-width: 0; flex: 1; }
  .role-head, .role-foot, .empty-row { padding-inline: 16px; }
  .two { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

  }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  /* Dates */
  function parse(iso) { var p = String(iso).split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function today() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function daysFrom(iso) { return Math.round((parse(iso) - today()) / 864e5); }
  function fmt(iso) {
    var d = parse(iso), o = { weekday: "short", day: "numeric", month: "short" };
    if (d.getFullYear() !== today().getFullYear()) o.year = "numeric";
    return d.toLocaleDateString("en-GB", o);
  }
  function fmtRange(a, b) {
    var d1 = parse(a), yr = d1.getFullYear() !== today().getFullYear() ? " " + d1.getFullYear() : "";
    if (!b || b === a) return d1.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + yr;
    var d2 = parse(b);
    if (d1.getMonth() === d2.getMonth()) return d1.getDate() + " to " + d2.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + yr;
    return d1.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " to " + d2.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + yr;
  }
  function rel(t) {
    if (t.status === "done") return "";
    var n = daysFrom(t.due);
    if (n < 0) return "Overdue by " + (-n) + (n === -1 ? " day" : " days");
    if (n === 0) return "Due today";
    if (n === 1) return "Due tomorrow";
    if (n <= 14) return "In " + n + " days";
    return "";
  }

  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 3500);
  }
  function roleOf(id) { return ROLES.filter(function (r) { return r.id === id; })[0]; }
  function isOpen(t) { return t.status !== "done"; }

  /* Render */
  function renderStats() {
    var open = tasks.filter(isOpen), done = tasks.length - open.length;
    var week = open.filter(function (t) { var n = daysFrom(t.due); return n >= 0 && n <= 7; }).length;
    var late = open.filter(function (t) { return daysFrom(t.due) < 0; }).length;
    var s = $("stats"); s.textContent = "";
    var ready = loaded.tasks;
    [["Open tasks", ready ? open.length : "-", ""], ["Due in 7 days", ready ? week : "-", ""], ["Overdue", ready ? late : "-", late > 0 ? "bad" : ""], ["Done", ready ? done : "-", ""]].forEach(function (x) {
      s.append(el("div", { class: "stat " + x[2] }, el("b", { text: x[1] }), el("span", { text: x[0] })));
    });
    var pct = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
    $("bar-fill").style.width = pct + "%";
    $("bar-label").textContent = ready ? done + " of " + tasks.length + " tasks done" : "";
  }

  function renderDates() {
    var ol = $("dates"); ol.textContent = "";
    var list = miles.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var t0 = today(), nextId = null;
    list.forEach(function (m) { if (nextId === null && parse(m.end || m.date) >= t0) nextId = m.id; });
    if (!list.length) { ol.append(el("li", {}, el("span", { text: loaded.miles ? "No dates added yet." : "Loading" }))); return; }
    list.forEach(function (m) {
      var past = parse(m.end || m.date) < t0;
      ol.append(el("li", { class: (m.id === nextId ? "next" : "") + (past ? " past" : "") },
        m.id === nextId ? el("em", { text: "Next" }) : null,
        el("b", { text: fmtRange(m.date, m.end) }),
        el("span", { text: m.label })));
    });
  }

  function renderTabs() {
    var box = $("tabs"); box.textContent = "";
    var all = [{ id: "all", name: "All roles" }].concat(ROLES);
    all.forEach(function (r) {
      var n = r.id === "all" ? tasks.filter(isOpen).length : tasks.filter(function (t) { return t.role === r.id && isOpen(t); }).length;
      box.append(el("button", { class: "tab", type: "button", "aria-pressed": String(roleFilter === r.id), onclick: function () { roleFilter = r.id; store("vb-role", r.id); render(); } },
        r.name, loaded.tasks ? el("small", { text: n }) : null));
    });
  }

  function matches(t) {
    if (statusFilter === "all") return true;
    if (statusFilter === "open") return isOpen(t);
    return t.status === statusFilter;
  }
  function order(a, b) {
    if ((a.status === "done") !== (b.status === "done")) return a.status === "done" ? 1 : -1;
    if (a.due !== b.due) return a.due < b.due ? -1 : 1;
    return (a.priority === "high" ? 0 : 1) - (b.priority === "high" ? 0 : 1);
  }

  function renderRow(t) {
    var n = daysFrom(t.due), r = rel(t);
    var cls = "row" + (t.status === "done" ? " done" : "") + (t.status !== "done" && n < 0 ? " late" : "") + (t.status !== "done" && n === 0 ? " today" : "");
    var chk = el("button", { class: "check", type: "button", "data-s": t.status, "aria-label": "Mark as " + STATUS[NEXT[t.status]] + ": " + t.title, onclick: function () { setStatus(t, NEXT[t.status]); } });
    chk.innerHTML = CHECK_SVG;
    return el("div", { class: cls },
      chk,
      el("div", { class: "main" },
        el("button", { class: "title-btn", type: "button", onclick: function () { openModal(t); } }, t.title),
        (function () {
          var ro = roleOf(t.role), who = t.owner && ro && t.owner !== ro.owner ? "Owner: " + t.owner : "";
          var line = who && t.notes ? who + " · " + t.notes : (who || t.notes || "");
          return line ? el("p", { class: "note", text: line }) : null;
        })()),
      el("div", { class: "meta" },
        el("div", { class: "due" }, el("span", { text: fmt(t.due) }), r ? el("small", { text: r }) : null),
        el("button", { class: "tag prio" + (t.priority === "high" ? "" : " low"), type: "button", title: "Click to change priority", "aria-label": "Priority " + (t.priority === "high" ? "high" : "normal") + ". Click to change.", onclick: function () { setPriority(t); }, text: t.priority === "high" ? "High" : "Normal" }),
        (function () {
          var sel = el("select", { class: "pill pill-sel s-" + t.status, "aria-label": "Status for " + t.title + ". Change it here." });
          Object.keys(STATUS).forEach(function (k) {
            var op = document.createElement("option"); op.value = k; op.textContent = STATUS[k]; if (k === t.status) op.selected = true; sel.appendChild(op);
          });
          sel.addEventListener("change", function () { setStatus(t, sel.value); });
          return sel;
        })(),
        el("button", { class: "edit-btn", type: "button", "aria-label": "Edit task: " + t.title, onclick: function () { openModal(t); }, text: "Edit" })));
  }

  function renderList() {
    var box = $("list"); box.textContent = "";
    if (!db && loaded.tasks === false) {
      box.append(el("div", { class: "empty" }, el("b", { text: "Loading tasks" }), el("span", { text: "One moment." })));
      return;
    }
    if (!db) {
      box.append(el("div", { class: "empty" }, el("b", { text: "Tasks are not available right now" }), el("span", { text: "Could not reach the tracker's data. Reload the page, or try again shortly." })));
      return;
    }
    if (!tasks.length) {
      box.append(el("div", { class: "empty" }, el("b", { text: "No tasks yet" }),
        el("span", { text: "Add the first task and give it a role and a deadline. Everyone on the team sees it right away." }),
        db ? el("button", { class: "btn primary", type: "button", onclick: function () { openModal({ role: roleFilter === "all" ? "president" : roleFilter }); } }, "Add task") : null));
      return;
    }
    var roles = ROLES.filter(function (r) { return roleFilter === "all" || r.id === roleFilter; });
    roles.forEach(function (r) {
      var mine = tasks.filter(function (t) { return t.role === r.id; });
      var done = mine.filter(function (t) { return t.status === "done"; }).length;
      var shown = mine.filter(matches).sort(order);
      var pct = mine.length ? Math.round((done / mine.length) * 100) : 0;
      var card = el("section", { class: "card role", "aria-label": r.name },
        el("div", { class: "role-head" },
          el("div", { class: "who" }, el("h2", { text: r.name }), el("p", { text: r.owner })),
          el("div", { class: "role-prog" }, el("div", { class: "bar" }, el("i", { style: "width:" + pct + "%" })), el("small", { text: done + " of " + mine.length + " done" }))));
      if (!shown.length) card.append(el("div", { class: "empty-row", text: mine.length ? "Nothing matches this filter." : "No tasks for this role yet." }));
      shown.forEach(function (t) { card.append(renderRow(t)); });
      if (db) card.append(el("div", { class: "role-foot" }, el("button", { class: "btn link", type: "button", onclick: function () { openModal({ role: r.id }); } }, "Add a task for " + r.name)));
      box.append(card);
    });
  }

  function render() {
    $("add-top").hidden = !db;
    renderStats(); renderDates(); renderTabs(); renderList();
  }

  /* Data */
  var API = "/api/tracker";

  function api(path, method, body) {
    return fetch(API + path, {
      method: method || "GET",
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    }).then(function (r) {
      if (!r.ok) throw new Error("Request failed");
      return r.json();
    });
  }

  function patchTaskLocal(id, patch) {
    tasks = tasks.map(function (t) { return t.id === id ? Object.assign({}, t, patch) : t; });
    render();
  }

  function setStatus(t, s) {
    if (!db) return;
    var prev = t.status;
    patchTaskLocal(t.id, { status: s });
    api("/tasks/" + t.id, "PATCH", { status: s }).catch(function () {
      patchTaskLocal(t.id, { status: prev });
      toast("Could not save that change. Try again.");
    });
  }

  function setPriority(t) {
    if (!db) return;
    var prev = t.priority, next = t.priority === "high" ? "normal" : "high";
    patchTaskLocal(t.id, { priority: next });
    api("/tasks/" + t.id, "PATCH", { priority: next }).catch(function () {
      patchTaskLocal(t.id, { priority: prev });
      toast("Could not save that change. Try again.");
    });
  }

  /* Modal */
  function openModal(t) {
    editing = t && t.id ? t : null;
    $("form-title").textContent = editing ? "Edit task" : "Add task";
    $("f-title").value = (t && t.title) || "";
    $("f-role").value = (t && t.role) || "president";
    $("f-due").value = (t && t.due) || "";
    $("f-status").value = (t && t.status) || "todo";
    $("f-priority").value = (t && t.priority) || "normal";
    $("f-notes").value = (t && t.notes) || "";
    var ro = roleOf($("f-role").value);
    var ownSel = $("f-owner"), want = (t && t.owner) || (ro ? ro.owner : "");
    ownSel.innerHTML = "";
    var names = ROLES.map(function (r) { return r.owner; });
    if (want && names.indexOf(want) < 0) names.push(want);
    names.forEach(function (n) { var op = document.createElement("option"); op.value = n; op.textContent = n; ownSel.appendChild(op); });
    ownSel.value = want;
    $("form-err").hidden = true;
    var del = $("delete-btn"); del.hidden = !editing; del.textContent = "Delete"; del.dataset.armed = "";
    $("overlay").hidden = false;
    setTimeout(function () { $("f-title").focus(); }, 0);
  }
  function closeModal() { $("overlay").hidden = true; editing = null; }

  function init() {
    var sel = $("f-role");
    ROLES.forEach(function (r) { sel.append(el("option", { value: r.id, text: r.name + " (" + r.owner + ")" })); });
    var rf = recall("vb-role"), sf = recall("vb-status");
    if (rf && (rf === "all" || roleOf(rf))) roleFilter = rf;
    if (sf && ["open", "todo", "doing", "blocked", "done", "all"].indexOf(sf) > -1) statusFilter = sf;
    $("status-filter").value = statusFilter;
    $("status-filter").addEventListener("change", function (e) { statusFilter = e.target.value; store("vb-status", statusFilter); render(); });
    $("add-top").addEventListener("click", function () { openModal({ role: roleFilter === "all" ? "president" : roleFilter }); });
    $("cancel-btn").addEventListener("click", closeModal);
    $("overlay").addEventListener("mousedown", function (e) { if (e.target === $("overlay")) closeModal(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("overlay").hidden) closeModal(); });
    $("delete-btn").addEventListener("click", function () {
      var b = $("delete-btn");
      if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Click again to delete"; return; }
      var id = editing && editing.id; closeModal();
      if (db && id) {
        tasks = tasks.filter(function (t) { return t.id !== id; });
        render();
        api("/tasks/" + id, "DELETE").catch(function () { toast("Could not delete. Try again. Reload to see the current state."); loadData(); });
      }
    });
    $("form").addEventListener("submit", function (e) {
      e.preventDefault();
      var title = $("f-title").value.trim(), due = $("f-due").value;
      if (!title || !due) { var er = $("form-err"); er.textContent = "Add a task name and a deadline."; er.hidden = false; return; }
      if (!db) return;
      var data = { title: title, role: $("f-role").value, due: due, status: $("f-status").value, priority: $("f-priority").value, owner: $("f-owner").value.trim(), notes: $("f-notes").value.trim() };
      var editId = editing && editing.id;
      closeModal();
      var req = editId ? api("/tasks/" + editId, "PATCH", data) : api("/tasks", "POST", data);
      req.then(function (result) {
        var saved = result.task;
        tasks = editId ? tasks.map(function (t) { return t.id === editId ? saved : t; }) : tasks.concat([saved]);
        render();
      }).catch(function () { toast("Could not save. Try again."); });
    });
    render();
    loadData();
  }

  function loadData() {
    api("/all", "GET").then(function (result) {
      db = true;
      tasks = (result.tasks || []).filter(function (t) { return t.title && t.due && t.role && STATUS[t.status]; });
      miles = (result.milestones || []).filter(function (m) { return m.label && m.date; });
      loaded.tasks = true; loaded.miles = true;
      render();
    }).catch(function () {
      db = false;
      loaded.tasks = true; loaded.miles = true;
      render();
    });
  }
  init();
})();
</script>
